name: Chudmich Android

on:
  workflow_dispatch:
  push:
    tags:
      - 'chudmich-v*'
      - 'premium-v*'

permissions:
  contents: read

concurrency:
  group: chudmich-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build release APK
    if: github.repository == 'jinnbuttcheeks/chudmich'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Only the release step needs to write; it is scoped to tag pushes below.
    permissions:
      contents: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ffigen (native codegen) needs libclang on the runner.
      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev

      - name: Restore Rust Cache
        id: cache-rust-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: chudmich-android-rust-${{ runner.os }}-${{ hashFiles('native/crates/native_core_ffi/rust-toolchain.toml', 'native/Cargo.lock') }}
          restore-keys: |
            chudmich-android-rust-${{ runner.os }}-

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@caac7f7e4298458a14238959504f411fc6cc7f06 # use-mise-action-v3.2.3
        with:
          github_token: ${{ github.token }}
          working_directory: ./mobile

      - name: Restore Gradle Cache
        id: cache-gradle-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mobile/android/.gradle
          key: chudmich-android-gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle', 'mobile/android/gradle/libs.versions.toml', 'mobile/pubspec.lock') }}
          restore-keys: |
            chudmich-android-gradle-${{ runner.os }}-

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ''

      - name: Install dependencies
        run: mise //mobile:install:ci

      - name: Perform codegen
        run: mise //mobile:codegen

      # The permanent release key lives in repo secrets. It is decoded straight to a file
      # (never echoed) and removed again in the always() step at the end of the job.
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.PREMIUM_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PREMIUM_KEYSTORE_B64 is missing or empty. The APK is built with the debug key and no release will be published. Sign and publish it manually."
          fi

      - name: Decode release keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.PREMIUM_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > mobile/android/key.jks
          test -s mobile/android/key.jks || { echo "::error::Decoded keystore is empty"; exit 1; }

      # build.gradle fails the build when key.jks is present but the passwords or alias do not open it.
      - name: Build release APK
        working-directory: ./mobile
        env:
          ALIAS: ${{ secrets.PREMIUM_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.PREMIUM_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.PREMIUM_STORE_PASSWORD }}
        run: flutter build apk --release

      - name: Verify APK signature
        if: steps.signing.outputs.enabled == 'true'
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs mobile/build/app/outputs/flutter-apk/app-release.apk \
            | grep -i "certificate SHA-256 digest" | head -n 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chudmich-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Only a properly signed APK is ever published.
      - name: Publish prerelease
        if: github.ref_type == 'tag' && steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#chudmich-v}"
          VERSION="${VERSION#premium-v}"
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "chudmich-${TAG}.apk"
          gh release create "$TAG" "chudmich-${TAG}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Chudmich ${VERSION}" \
            --prerelease \
            --generate-notes

      - name: Skip release without signing secrets
        if: github.ref_type == 'tag' && steps.signing.outputs.enabled != 'true'
        run: |
          echo "::warning::Not publishing a release for ${GITHUB_REF_NAME} because signing secrets are missing. The debug-signed APK is only attached to the workflow run."

      - name: Remove keystore
        if: always()
        run: rm -f mobile/android/key.jks

      - name: Save Rust Cache
        if: steps.cache-rust-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cache-rust-restore.outputs.cache-primary-key }}

      - name: Save Gradle Cache
        if: steps.cache-gradle-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mobile/android/.gradle
          key: ${{ steps.cache-gradle-restore.outputs.cache-primary-key }}
