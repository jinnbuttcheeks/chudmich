def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
  keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
  compileSdk = flutter.compileSdkVersion
  ndkVersion = flutter.ndkVersion

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
    coreLibraryDesugaringEnabled true
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  sourceSets {
    main.java.srcDirs += 'src/main/kotlin'
  }

  buildFeatures {
    buildConfig true
    compose true
  }

  defaultConfig {
    applicationId "app.alextran.immich"
    // Installs alongside the official Immich app.
    applicationIdSuffix ".jinn"
    minSdk = 26
    targetSdk = flutter.targetSdkVersion
    // The semantic version (3.4.1) must stay intact: the app compares it with the server version.
    // premium.2: pubspec build number (3040199) + 2 = 3040201. Bump the offset with every premium release.
    versionCode flutter.versionCode + 2
    versionName "${flutter.versionName}-premium.2"
    resValue "string", "app_name", "Immich Premium"
    buildConfigField "boolean", "PASSKEYS", "true"
  }

  signingConfigs {
    release {
      def keyAliasVal = System.getenv("ALIAS")
      def keyPasswordVal = System.getenv("ANDROID_KEY_PASSWORD")
      def storePasswordVal = System.getenv("ANDROID_STORE_PASSWORD")

      keyAlias keyAliasVal ?: keystoreProperties['keyAlias']
      keyPassword keyPasswordVal ?: keystoreProperties['keyPassword']
      storeFile file("../key.jks").exists() ? file("../key.jks") : file(keystoreProperties['storeFile'] ?: '../key.jks')
      storePassword storePasswordVal ?: keystoreProperties['storePassword']
    }
  }

  buildTypes {
    debug {
      applicationIdSuffix '.debug'
      versionNameSuffix '-DEBUG'
    }

    release {
      def hasKeystore = file("../key.jks").exists() && file("../key.jks").length() > 0
      signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

      def prNumber = System.getenv("PR_NUMBER")
      if (prNumber) {
        applicationIdSuffix ".pr${prNumber}"
        versionNameSuffix "-pr${prNumber}"
        resValue "string", "app_name", "Immich PR ${prNumber}"
      }
    }
  }
  namespace 'app.alextran.immich'
}

// Release signing must never silently degrade. When a keystore is present (CI decodes
// PREMIUM_KEYSTORE_B64 into android/key.jks) the credentials have to exist and open it,
// otherwise the build fails here instead of producing a debug-signed or unsigned APK.
// Without a keystore the debug fallback above stays, for local builds.
gradle.taskGraph.whenReady { graph ->
  def releaseRequested = graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') && (it.name.startsWith('assemble') || it.name.startsWith('package') || it.name.startsWith('bundle') || it.name.startsWith('validateSigning')) }
  def keystoreFile = file("../key.jks")
  if (!releaseRequested || !keystoreFile.exists() || keystoreFile.length() == 0) {
    return
  }

  def alias = System.getenv("ALIAS") ?: keystoreProperties['keyAlias']
  def keyPassword = System.getenv("ANDROID_KEY_PASSWORD") ?: keystoreProperties['keyPassword']
  def storePassword = System.getenv("ANDROID_STORE_PASSWORD") ?: keystoreProperties['storePassword']
  if (!alias || !keyPassword || !storePassword) {
    throw new GradleException("android/key.jks is present but ALIAS, ANDROID_KEY_PASSWORD or ANDROID_STORE_PASSWORD is not set. Refusing to build a release APK without the release signing key.")
  }

  def store = java.security.KeyStore.getInstance("PKCS12")
  try {
    keystoreFile.withInputStream { store.load(it, storePassword.toCharArray()) }
  } catch (Exception e) {
    throw new GradleException("Could not open android/key.jks with the provided store password (${e.class.simpleName}). Refusing to fall back to debug signing.")
  }
  if (!store.containsAlias(alias)) {
    throw new GradleException("android/key.jks does not contain the key alias given in ALIAS. Refusing to fall back to debug signing.")
  }
  try {
    if (store.getKey(alias, keyPassword.toCharArray()) == null) {
      throw new GradleException("android/key.jks alias has no private key.")
    }
  } catch (GradleException e) {
    throw e
  } catch (Exception e) {
    throw new GradleException("Could not read the signing key from android/key.jks with the provided key password (${e.class.simpleName}). Refusing to fall back to debug signing.")
  }
}

